<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hallpay - Sign Up</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <div class="header-left">
    <img src="/hallpaylogo.png" alt="Hallpay Logo" class="header-logo">
    <div>Sign Up</div>
  </div>
</header>

<main class="auth-main">
  <section class="auth-card">
  <img src="/hallpaylogofull.png" alt="Hallpay Logo" class="home-logo">
    <h1>Sign Up</h1>
    <input id="email" placeholder="Email (must be @standrews-de.org)">

    <button onclick="signup()">Sign Up</button>

    <p>Already have an account? <a href="/login">Login</a></p>
    <p id="status"></p>
  </section>
</main>

<script>
async function signup() {
  const email = document.getElementById("email").value.trim();

  const res = await fetch("/signup", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ email })
  });

  const text = await res.text();
  document.getElementById("status").textContent = text;
}
</script>

</body>
</html>
