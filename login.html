<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hallpay - Login</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <div class="header-left">
    <img src="/hallpaylogo.png" alt="Hallpay Logo" class="header-logo">
    <div>Login</div>
  </div>
</header>

<main class="auth-main">
  <section class="auth-card">
  <img src="/hallpaylogofull.png" alt="Hallpay Logo" class="home-logo">
    <h1>Login</h1>

    <input id="email" placeholder="Email (must be @standrews-de.org)">
    <input id="password" type="password" placeholder="Password">

    <button onclick="login()">Login</button>
    <button onclick="forgotPassword()">Forgot Password</button>

    <p>No account? <a href="/signup">Sign up!</a></p>
    <p id="status"></p>
  </section>
</main>

<script>
async function login() {
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;

  const res = await fetch("/login", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ email, password })
  });

  const text = await res.text();

  if (res.ok) {
    window.location = "/home";
  } else {
    document.getElementById("status").textContent = text;
  }
}

async function forgotPassword() {
  const email = prompt("Enter your email:");
  if (!email) return;

  const res = await fetch("/forgot-password", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ email })
  });

  const text = await res.text();
  document.getElementById("status").textContent = text;
}
</script>

</body>
</html>
